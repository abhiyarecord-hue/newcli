[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-types = { path = "../agent-types" }
runtime-core = { path = "../runtime-core" }
async-trait = { workspace = true }
tokio = { version = "1.0", features = ["process", "time", "io-util", "sync", "macros", "rt", "net"] }
tokio-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
ipnet = "2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "=1.6.0"
tempfile = "3"

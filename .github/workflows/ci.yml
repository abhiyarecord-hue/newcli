name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for the opt-in live-integration job below, which gates itself on
  # `github.event_name == 'workflow_dispatch'`. Without this trigger that job
  # could never run at all, so its evidence could never be produced.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Local runs on Windows hit `LNK1201` when anti-malware holds a freshly written
  # `.pdb` during parallel linking. Test binaries do not need debug info for the
  # gate, and omitting it removes that whole class of flake.
  CARGO_PROFILE_TEST_DEBUG: 0
  # Deterministic, offline-only gate: no test may reach the network or require a
  # credential. Live interoperability runs in the separate opt-in job below.
  AGENT_LIVE_TESTS: "0"

jobs:
  quality:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform must report; one failure must not mask another's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `@stable`. An unpinned stable meant a new upstream release
      # could turn this gate red on an unrelated pull request, and it did: a
      # Clippy lint added after the local toolchain's version passed locally and
      # failed on all three runners. Keep `toolchain:` identical to the
      # `channel` in rust-toolchain.toml so the local and CI gates agree.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Every step below is a blocking gate. `continue-on-error` must never be
      # added here: a warning or failure has to fail the job.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check all targets
        run: cargo check --workspace --all-targets

      - name: Test all targets
        run: cargo test --workspace --all-targets

      - name: Documentation tests
        run: cargo test --workspace --doc

  live-integration:
    name: Live integration (opt-in, non-blocking evidence)
    # Never runs on a pull request and never gates a merge. It exists so live
    # provider, MCP, LSP, and editor checks are recorded as their own evidence
    # and can be honestly disclosed as `not_run` when skipped. A skipped live
    # check must never be presented as local protocol coverage.
    if: github.event_name == 'workflow_dispatch'
    # Pinned rather than `-latest` so a recorded live result names an exact image,
    # and so the blocking matrix above stays the single source of platform labels.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same pinned toolchain as the blocking matrix, so a recorded live result
      # names an exact compiler as well as an exact image.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Report live-check status
        run: echo "Live integration checks are opt-in and are recorded separately in the validation manifest."
